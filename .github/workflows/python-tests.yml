name: RoadEye Enterprise CI/CD & MLOps Quality Gates

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  mlops-ci-pipeline:
    name: MLOps Quality Gates (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Core & Testing Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Validate MLOps Model Registry & Catalog Integrity (CLO1)
      run: |
        python -c "from mlops.experiment_tracker import ExperimentTracker; tracker = ExperimentTracker(); models = tracker.list_models(); assert len(models) >= 3; print('✅ Model Registry Verified:', list(models.keys()))"

    - name: Validate Covariate & Concept Drift Engine (CLO3)
      run: |
        python -c "from mlops.drift_monitor import DriftMonitor; monitor = DriftMonitor(); monitor.record_inference(latency_ms=15.0, confidences=[0.8, 0.85], classes=['pothole'], luminance=125.0); report = monitor.evaluate(); assert report.status == 'HEALTHY'; print('✅ Drift Monitor Engine Operational: Status =', report.status)"

    - name: Validate Explainable AI & TinyML Edge Engines (CLO2, CLO3)
      run: |
        python -c "from mlops.explainability import XAIExplainer, FairnessAuditor; explainer = XAIExplainer(); attr = explainer.explain_detection('pothole', 0.85, [10, 20, 50, 60]); assert len(attr.attributions) == 4; from mlops.edge_optimizer import EdgeOptimizer; opt = EdgeOptimizer(); p = opt.get_quantization_profile(precision='INT8'); assert p.compressed_size_mb < 5.0; print('✅ XAI & TinyML Edge Optimizer Verified')"

    - name: Run Full Automated Unit & Regression Test Suite (77 Tests)
      run: |
        python -m unittest discover tests -v

  docker-build-verification:
    name: Docker Packaging & Containerization Verification (CLO2)
    runs-on: ubuntu-latest
    needs: mlops-ci-pipeline
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Validate Dockerfile Build Syntax
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        tags: roadeye:ci-test
        cache-from: type=gha
        cache-to: type=gha,mode=max
