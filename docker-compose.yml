version: '3.8'

services:
  roadeye-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: roadeye_production_service
    restart: unless-stopped
    ports:
      - "5000:5000"
      - "8080:8080"
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
      - OPENBLAS_NUM_THREADS=1
      - HOST=0.0.0.0
      - PORT=5000
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
      - ./models:/app/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
