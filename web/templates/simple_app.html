function App() {
  const [activeTab, setActiveTab] = useState('home');
  const [lang, setLang] = useState('en');
  const [isDark, setIsDark] = useState(() => {
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  });
  const [data, setData] = useState(() => {
    return window.__INITIAL_DATA__ || null;
  });
  const [loading, setLoading] = useState(() => {
    return !window.__INITIAL_DATA__;
  });
  const [error, setError] = useState(null);
  const [toast, setToast] = useState(null);

  // Map panel selection state
  const [selectedDot, setSelectedDot] = useState(null);
  const t = I18N[lang];

  // Dark mode class sync
  useEffect(() => {
    if (isDark) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  }, [isDark]);

  // Fetch unified data from backend
  const fetchData = async (isBackground = false) => {
    if (!isBackground) {
      setLoading(true);
    }
    setError(null);
    try {
      const res = await fetch('/api/simple/data');
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const json = await res.json();
      if (json.success) {
        setData(json);
      } else {
        throw new Error(json.error || 'Server returned failure');
      }
    } catch (err) {
      console.error('Data fetch error:', err);
      setError(err.message || 'Network error');
    } finally {
      setLoading(false);
    }
  };
  useEffect(() => {
    fetchData(Boolean(window.__INITIAL_DATA__));
  }, []);
  const showToast = message => {
    setToast(message);
    setTimeout(() => setToast(null), 3200);
  };

  // Handler for "Fix" button on Screen 1 & "Create repair" on Screen 2
  const handleCreateOrAdvanceRepair = async item => {
    if (!item) return;
    const incId = item.incident_id || item.id && item.id.replace('WO-', '');

    // Optimistically update local repairs list
    if (data && data.repairs) {
      const existing = data.repairs.find(r => r.incident_id === Number(incId) || r.id === item.id);
      if (existing) {
        existing.status = 'In progress';
      } else {
